[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "wyoming-tts-hub"
version = "0.1.0"
description = "A simple, robust, and performant Wyoming protocol server built around a TTS Engine Hub that aggregates TTS Engines"
readme = "README.md"
license = {text = "MIT"}
authors = [{name = "Dmitry Kiselev", email = "dmitry@example.com"}]
keywords = [
    "wyoming",
    "tts",
    "text-to-speech",
    "tts-engine-hub",
    "silero",
    "home-assistant",
]
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0.0",
    "torch==2.12.1",
    # Qwen3-TTS pulls torchaudio. Pin its last release to the same CPU index as torch so
    # the resolver cannot install a second torch build; torchaudio 2.11.0 imports and runs
    # against torch 2.12.1 even though no 2.12 release of torchaudio exists.
    "torchaudio==2.11.0",
    "numpy==2.4.6",
    "pyyaml==6.0.3",
    "loguru>=0.7.3",
    "razdel>=0.5.0",
    "wyoming>=1.10.0",
    "zeroconf>=0.149.16",
    "openai>=2.43.0",
    # Qwen3-TTS is a large install because importing the package eagerly imports its 25 Hz
    # speech tokenizer. That pulls in audio and inference libraries (librosa, soundfile, sox,
    # onnxruntime, torchaudio) the 12 Hz path never uses. It also declares a Gradio web UI
    # that is only reachable through its own demo command.
    "qwen-tts==0.1.1",
]

[project.urls]
Homepage = "https://github.com/dkindev/wyoming-tts-hub"
Repository = "https://github.com/dkindev/wyoming-tts-hub"
Issues = "https://github.com/dkindev/wyoming-tts-hub/issues"

[project.scripts]
wyoming-tts-hub = "src.main:run"

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-asyncio>=0.21.0",
    "httpx>=0.24.0",
    "ruff>=0.1.0",
    "pre-commit>=3.0.0",
]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = [{ index = "pytorch-cpu" }]
torchaudio = [{ index = "pytorch-cpu" }]

[tool.setuptools]
package-dir = {"" = "."}

[tool.setuptools.packages.find]
# Every subpackage under `src` is part of the distribution. Naming only the top one
# builds a wheel holding `src/main.py` and none of the code it imports, so the installed
# command fails on import.
include = ["src*"]

[tool.ruff]
line-length = 100
target-version = "py311"
exclude = [
    ".git",
    ".venv",
    "__pycache__",
    "build",
    ".dist",
    "models",
    "data"
]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "C",    # flake8-comprehensions
    "B",    # flake8-bugbear
    "UP",   # pyupgrade
]
ignore = [
    "E501",  # line too long (handled by ruff format)
]

[tool.ruff.lint.isort]
known-first-party = ["src"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "auto"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-v --strict-markers"
markers = [
    "asyncio: marks tests as async",
]

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
