# Application name. Used as a Wyoming service name.
# CLI: --app_name
# Env: TTS_APP_NAME
app_name: Wyoming TTS Hub

# Application environment type (development or production).
# CLI: --env_type
# Env: TTS_ENV_TYPE
env_type: production

# URI for the Wyoming server (tcp://host:port).
# CLI: --uri
# Env: TTS_URI
uri: tcp://127.0.0.1:10200

# Zeroconf discovery name. Empty string disables.
# CLI: --zeroconf
# Env: TTS_ZEROCONF
zeroconf: wyoming-tts-hub

# Runtime allowlist of model ids this instance serves. This is the sole switch:
# a model is served only if listed here, and an absent or empty list serves nothing.
# CLI: --active_models a --active_models b
# Env: TTS_ACTIVE_MODELS=["silero_ru","silero_en"]
active_models: [silero_ru]

# Model ids to preload at startup, up to max_models. Ids must also be listed in
# active_models; an inactive id is skipped with a warning, and an undeclared one
# fails startup.
# CLI: --warmup_models silero_ru --warmup_models silero_en
# Env: TTS_WARMUP_MODELS=["silero_ru"]
warmup_models: [silero_ru]

# Voice ids in '<model id>-<voice name>' form to pre-build Voice Prompts for at
# startup, up to max_voice_prompts, so the first request for a warmed voice skips
# the prompt build.
# CLI: --warmup_voices silero_ru-aidar --warmup_voices silero_ru-baya
# Env: TTS_WARMUP_VOICES=["silero_ru-aidar"]
warmup_voices: []

# Maximum number of Voice Prompts to cache in memory.
# The least recently used Voice Prompt is evicted when limit reached.
# CLI: --max_voice_prompts
# Env: TTS_MAX_VOICE_PROMPTS
max_voice_prompts: 8

# Enable audio streaming.
# CLI: --streaming / --no-streaming
# Env: TTS_STREAMING
streaming: true

# TTS backend engine type.
# CLI: --backend_type
# Env: TTS_BACKEND_TYPE
backend_type: torch

# Timeout for inference of one sentence in seconds.
# CLI: --inference_timeout
# Env: TTS_INFERENCE_TIMEOUT
inference_timeout: 5

# Frame duration in milliseconds.
# CLI: --frame_duration
# Env: TTS_FRAME_DURATION
frame_duration: 50

# Maximum number of models to cache in memory.
# Model with the lowest RPS rating is evicted when limit reached.
# CLI: --max_models
# Env: TTS_MAX_MODELS
max_models: 2

# Period of downtime in seconds during which the model's RPS will be halved.
# CLI: --cache_half_life
# Env: TTS_CACHE_HALF_LIFE
cache_half_life: 60

# Maximum concurrent sentences per model for TTS processing.
# CLI: --max_concurrent_sentences_per_model
# Env: TTS_MAX_CONCURRENT_SENTENCES_PER_MODEL
max_concurrent_sentences_per_model: 2

# Maximum character count per text sentence for TTS processing.
# CLI: --max_sentence_chars
# Env: TTS_MAX_SENTENCE_CHARS
max_sentence_chars: 140

# Local path to the voice/model mapping configuration file.
# CLI: --data_yml_path
# Env: TTS_DATA_YML_PATH
data_yml_path: data/data.yml

# Directory for cached model files.
# CLI: --models_dir
# Env: TTS_MODELS_DIR
models_dir: models

# PyTorch computing engine settings.
# Note: num_threads x num_interop_threads <= physical cores.
torch:
  # Device to run TTS model on (cpu, cuda, xpu).
  # CLI: --torch_device
  # Env: TTS_TORCH__DEVICE
  device: cpu

  # Number of PyTorch intra-op threads.
  # CLI: --torch_num_threads
  # Env: TTS_TORCH__NUM_THREADS
  num_threads: 4

  # Number of PyTorch inter-op threads.
  # CLI: --torch_num_interop_threads
  # Env: TTS_TORCH__NUM_INTEROP_THREADS
  num_interop_threads: 1

  # Flush denormal floats for performance.
  # CLI: --torch_flush_denormal / --no-torch_flush_denormal
  # Env: TTS_TORCH__FLUSH_DENORMAL
  flush_denormal: true

# Settings for Silero models.
# Env only (not available via CLI).
silero:
  # Audio sample rate in Hz (8000, 16000, 24000, 48000).
  # Env: TTS_SILERO__SAMPLE_RATE
  sample_rate: 48000
  
  # URL to the Silero models.yml registry file.
  # Env: TTS_SILERO__MODELS_YML_URL
  models_yml_url: https://raw.githubusercontent.com/snakers4/silero-models/refs/heads/master/models.yml

  # SHA-256 hash of the Silero models.yml file for integrity verification. Set empty to skip validation.
  # Env: TTS_SILERO__MODELS_YML_HASH
  models_yml_hash: ""

# Text normalization settings.
# Env only (not available via CLI).
normalization:
  # Timeout for input text normalization in seconds.
  # Env: TTS_NORMALIZATION__TIMEOUT
  timeout: 5

  # Maximum concurrent sentences per request for normalization.
  # Env: TTS_NORMALIZATION__MAX_CONCURRENT_SENTENCES_PER_REQUEST
  max_concurrent_sentences_per_request: 2

  # Plain text normalization settings.
  text:
    # Enable plain text normalization.
    # Env: TTS_NORMALIZATION__TEXT__ENABLED
    enabled: true

    # Normalizer type (simple, openai).
    # Env: TTS_NORMALIZATION__TEXT__TYPE
    type: simple

    # Per-Language LLM prompts for text normalization (config.yml only).
    # Keyed by the Language a Model Info declares, e.g. ru — not by a locale such as ru_RU.
    prompts:
      ru:
        text: |
          Ты — инструмент подготовки текста для русского TTS.
          Твоя единственная задача — заменить цифры словами, раскрыть сокращения (т.е., т.д.) и перевести латиницу в кириллическое звучание (Apple -> Эппл).
          
          ЖЕСТКОЕ ПРАВИЛО:
          1. Обычные русские слова изменяться НЕ ДОЛЖНЫ. Не меняй их падежи, склонения, времена и окончания. Оставляй их ровно в том виде, в каком они написаны.
          2. Не занимайся лемматизацией и не пересказывай текст.
          3. Выдавай ТОЛЬКО обработанный текст, без каких-либо комментариев.
        model: qwen3.5:4b

  # SSML normalization settings.
  ssml:
    # Enable SSML markup normalization.
    # Env: TTS_NORMALIZATION__SSML__ENABLED
    enabled: false

    # Normalizer type (simple, openai).
    # Env: TTS_NORMALIZATION__SSML__TYPE
    type: simple

    # Per-Language LLM prompts for SSML normalization.
    # prompts:
    #   en:
    #     text: Normalize english text for TTS...
    #     model: qwen3.5:4b

  # OpenAI-compatible API settings for OpenAi-based normalization.
  openai:
    # Base URL for OpenAI-compatible API.
    # Env: TTS_NORMALIZATION__OPENAI__BASE_URL (fallback: OPENAI_BASE_URL)
    base_url: ""

    # API key for OpenAI-compatible API.
    # Env: TTS_NORMALIZATION__OPENAI__API_KEY (fallback: OPENAI_API_KEY)
    api_key: ""
